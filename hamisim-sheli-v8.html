<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ECEDE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="המיסים שלי">
<title>מי נהנה מהכסף שלי?</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;600&family=Heebo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#EFEEE6;
  --paper-card:#F7F6F0;
  --ink:#1B2A3D;
  --ink-soft:#5B6B78;
  --gold:#C4941F;
  --stamp:#C4432E;
  --line:#D8D6C6;
  --line-strong:#B9B8A4;

  --c-haredSub:#C4432E;
  --c-wb:#9A4670;
  --c-edu:#C4941F;
  --c-otherEdu:#2E7D8C;

  --grad-1:#16283B;
  --grad-2:#2B5F6E;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body{ height:100%; }

body{
  margin:0 auto;
  max-width:480px;
  background:var(--paper);
  font-family:'Heebo', sans-serif;
  color:var(--ink);
  display:flex;
  flex-direction:column;
  min-height:100dvh;
  overflow:hidden;
}

.appbar{
  flex-shrink:0;
  padding:calc(env(safe-area-inset-top, 14px) + 8px) 20px 16px;
  background:linear-gradient(135deg, var(--grad-1), var(--grad-2));
}
.appbar .kicker{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:0.06em; color:#E8C468; margin:0 0 4px; direction:ltr; text-align:right; }
.appbar h1{ font-family:'Frank Ruhl Libre', serif; font-size:21px; font-weight:600; margin:0; color:#fff; }

.screen{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 18px 24px; }
.screen::-webkit-scrollbar{ display:none; }

.view{ display:none; }
.view.active{ display:block; }

.field{ margin-bottom:16px; }
.field label{ font-size:12.5px; font-weight:600; color:var(--ink); display:block; margin-bottom:6px; }

input[type=number], select{
  width:100%; border:1px solid var(--line-strong); background:#fff;
  padding:12px 12px; font-family:'Heebo', sans-serif; font-size:16px;
  color:var(--ink); border-radius:10px; height:48px;
}
input[type=number]{ font-family:'IBM Plex Mono', monospace; direction:ltr; text-align:right; }
select{ -webkit-appearance:none; appearance:none; }

.select-wrap{ position:relative; width:fit-content; max-width:100%; }
.select-wrap select.select-fit{
  width:calc(18ch + 46px); max-width:100%; padding-left:32px; padding-right:12px;
}
.select-arrow{
  position:absolute; left:11px; top:50%; transform:translateY(-50%);
  width:15px; height:15px; color:var(--ink-soft); pointer-events:none;
}

input.input-currency{
  width:9ch; min-width:120px; max-width:100%;
}

.stepper{
  display:flex; align-items:center; gap:10px; width:fit-content;
}
.stepper button{
  width:34px; height:34px; flex-shrink:0; border-radius:8px; border:1px solid var(--line-strong);
  background:#fff; color:var(--ink); font-size:16px; font-family:'IBM Plex Mono', monospace;
  line-height:1; display:flex; align-items:center; justify-content:center;
}
.stepper button:active{ background:var(--paper); }
.stepper input[type=number]{
  width:3ch; min-width:34px; height:34px; padding:0; text-align:center;
  border-radius:0; border:none; border-top:1px solid var(--line-strong); border-bottom:1px solid var(--line-strong);
  background:transparent; font-size:15px;
}
.stepper input[type=number]::-webkit-inner-spin-button,
.stepper input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }

.two-col{ display:flex; gap:26px; }

.chip-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px; }
.chip{
  border:1px solid var(--line-strong); background:#fff; font-size:12.5px; padding:10px 8px;
  text-align:center; border-radius:9px; color:var(--ink-soft); user-select:none;
}
.chip.active{ background:var(--grad-1); color:#fff; border-color:var(--grad-1); font-weight:600; }

.go-btn{
  width:fit-content; padding:12px 24px; background:linear-gradient(135deg, var(--stamp), #A82E1C); color:#fff; border:none;
  border-radius:10px; font-family:'Heebo', sans-serif; font-size:14px; font-weight:700;
  margin:16px auto 0; display:flex; align-items:center; justify-content:center; gap:7px;
  box-shadow:0 3px 8px rgba(196,67,46,0.22);
}
.go-btn svg{ width:16px; height:16px; }
.go-btn:active{ opacity:0.88; box-shadow:none; }

.result-sub{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-soft); margin-bottom:16px; direction:ltr; text-align:right; }

.figure-card{
  display:flex; align-items:flex-start; gap:13px;
  background:#fff; border:1px solid var(--line-strong); border-right:5px solid var(--accent, var(--ink));
  border-radius:12px 4px 4px 12px; padding:16px 17px 18px; margin-bottom:12px;
  box-shadow:0 2px 8px rgba(27,42,61,0.05);
}
.figure-icon{
  width:42px; height:42px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--accent-tint, rgba(27,42,61,0.08));
}
.figure-icon svg{ width:21px; height:21px; }
.figure-content{ flex:1; min-width:0; }
.figure-card .label{ font-size:14.5px; font-weight:700; color:var(--ink); line-height:1.35; }
.figure-card .amt{ font-family:'IBM Plex Mono', monospace; font-size:27px; font-weight:700; margin-top:10px; color:var(--accent, var(--ink)); direction:ltr; text-align:right; }
.figure-card .bar-track{ height:6px; background:var(--line); margin-top:10px; border-radius:3px; overflow:hidden; direction:ltr; }
.figure-card .bar-fill{ height:100%; background:var(--accent, var(--ink)); border-radius:3px; }

.disclaimer{ font-size:10.5px; color:var(--ink-soft); text-align:center; margin-top:6px; padding:10px 4px 2px; }

.tabbar{
  flex-shrink:0; display:flex; border-top:1px solid var(--line-strong);
  background:var(--paper-card); padding:8px 10px calc(env(safe-area-inset-bottom, 10px) + 8px);
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px 0;
  color:var(--ink-soft); font-size:10px; font-family:'Heebo', sans-serif; background:none; border:none;
}
.tab.active{ color:var(--stamp); font-weight:600; }
.tab svg{ width:19px; height:19px; }
</style>
</head>
<body>

<div class="appbar">
  <p class="kicker">דוגמית להמחשה בלבד</p>
  <h1>מי נהנה מהכסף שלי?</h1>
</div>

<div class="screen">

  <div class="view active" id="view-details">
    <div class="field">
      <label for="salary">משכורת ברוטו חודשית של משק הבית (₪)</label>
      <input class="input-currency" type="number" id="salary" value="0" min="0" step="500" inputmode="numeric">
    </div>

    <div class="two-col">
      <div class="field">
        <label for="hhsize">גודל משק הבית</label>
        <div class="stepper" data-target="hhsize">
          <button type="button" data-dir="1">+</button>
          <input type="number" id="hhsize" value="0" min="0" max="14" step="1" inputmode="numeric" readonly>
          <button type="button" data-dir="-1">−</button>
        </div>
      </div>
      <div class="field">
        <label for="kids">ילדים תלויים</label>
        <div class="stepper" data-target="kids">
          <button type="button" data-dir="1">+</button>
          <input type="number" id="kids" value="0" min="0" max="12" step="1" inputmode="numeric" readonly>
          <button type="button" data-dir="-1">−</button>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="eduSelect">מערכת החינוך בשימוש</label>
      <div class="select-wrap">
        <select id="eduSelect" class="select-fit">
          <option value="" disabled selected>בחר אחת</option>
          <option value="mamlachti">ממלכתי</option>
          <option value="mamlachtiDati">ממלכתי-דתי</option>
          <option value="haredi">חרדי / עצמאי</option>
          <option value="arab">מגזר ערבי</option>
        </select>
        <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>

    <div class="field">
      <label for="benefit">קטגוריית הטבת מס מיוחדת</label>
      <div class="select-wrap">
        <select id="benefit" class="select-fit">
          <option value="" disabled selected>בחר אחת</option>
          <option value="none">ללא</option>
          <option value="oleh">עולה חדש</option>
          <option value="disability">אדם עם מוגבלות</option>
          <option value="singleParent">הורה יחיד</option>
          <option value="reservist">מילואימניק / לוחם</option>
        </select>
        <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>

    <button class="go-btn" id="goResults">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      מי נהנה מהכסף שלי?
    </button>
  </div>

  <div class="view" id="view-results">
    <div class="result-sub" id="subline">משק בית של 4 · 2 ילדים תלויים</div>
    <div id="figureGrid"></div>
    <p class="disclaimer">אומדן להמחשה בלבד.</p>
    <p class="disclaimer" id="sourceLine" style="margin-top:-4px;"></p>
  </div>

</div>

<div class="tabbar">
  <button class="tab active" id="tabDetails">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16l-4-3-3 3-3-3-4 3z"/><path d="M8 9h8M8 13h5"/></svg>
    פרטים
  </button>
  <button class="tab" id="tabResults">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M11 20V4M18 20v-7"/></svg>
    תוצאות
  </button>
</div>

<script>
// ---- Operator-editable national assumptions ---------------------------
// Paste each tab's "Publish to web -> CSV" link here (Google Sheets lets you
// publish one tab at a time -- publish "National assumptions" for the first,
// "Tax calculation" for the second, and paste each resulting link below).
// Column A in each sheet must match the LABELS below exactly. Leave a URL
// blank to run that sheet entirely on its built-in reference values.
const BUDGET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS3_N-a6NNo_KSyFuMWomIl-J1AbWSEmkTMaWasgaT4kMIrkeLFMtr-waTI2UsK2Io5wOeRQJfZ83La/pub?gid=0&single=true&output=csv';
const TAX_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS3_N-a6NNo_KSyFuMWomIl-J1AbWSEmkTMaWasgaT4kMIrkeLFMtr-waTI2UsK2Io5wOeRQJfZ83La/pub?gid=630032819&single=true&output=csv';

const BUDGET_LABELS = {
  totalBudget: "Total 2026 budget (NIS millions)",
  haredDirect: "Direct subsidies to Haredi community (NIS millions)",
  haredIndirect: "Indirect subsidies to Haredi community (NIS millions)",
  wbDirect: "Direct subsidies to West Bank civilian residents (NIS millions)",
  wbInfra: "Investment in West Bank civilian infrastructure (NIS millions)",
  wbOther: "Other subsidies to West Bank civilian settlements (NIS millions)",
  eduMamlachti: "Budget for Mamlachti education stream (NIS millions)",
  eduHaredi: "Budget for Haredi education stream (NIS millions)",
  eduMamlachtiDati: "Budget for religious education stream (NIS millions)",
  eduArab: "Budget for Arab education stream (NIS millions)"
};

// Reference values (Claude's estimates, sourced in national-assumptions-template.csv).
const BUDGET_DEFAULTS = {
  totalBudget: 850600,
  haredDirect: 3000,
  haredIndirect: 6000,
  wbDirect: 1500,
  wbInfra: 2500,
  wbOther: 1000,
  eduMamlachti: 36860,
  eduHaredi: 23280,
  eduMamlachtiDati: 15520,
  eduArab: 21340
};

const TAX_LABELS = {
  b1Limit: "Income tax bracket 1 upper limit (NIS)",
  b1Rate: "Income tax bracket 1 rate (%)",
  b2Limit: "Income tax bracket 2 upper limit (NIS)",
  b2Rate: "Income tax bracket 2 rate (%)",
  b3Limit: "Income tax bracket 3 upper limit (NIS)",
  b3Rate: "Income tax bracket 3 rate (%)",
  b4Limit: "Income tax bracket 4 upper limit (NIS)",
  b4Rate: "Income tax bracket 4 rate (%)",
  b5Limit: "Income tax bracket 5 upper limit (NIS)",
  b5Rate: "Income tax bracket 5 rate (%)",
  b6Limit: "Income tax bracket 6 upper limit (NIS)",
  b6Rate: "Income tax bracket 6 rate (%)",
  b7Rate: "Income tax bracket 7 - top rate, above bracket 6 limit (%)",
  creditPointValue: "Credit point value (NIS per point per year)",
  creditPerAdult: "Credit points per adult",
  creditPerChild: "Credit points per dependent child",
  creditBenefitBonus: "Credit points bonus for special benefit category",
  niHealthRate: "National Insurance + health tax rate (%)",
  vatRate: "VAT rate (%)",
  vatBase: "VAT spending share for a 1-person household (%)",
  vatIncrement: "VAT spending share increase per additional household member (percentage points)",
  vatCap: "VAT spending share cap (%)"
};

// Reference values (Claude's estimates, sourced in tax-calculation-parameters.csv).
const TAX_DEFAULTS = {
  b1Limit: 84120, b1Rate: 10,
  b2Limit: 120720, b2Rate: 14,
  b3Limit: 193800, b3Rate: 20,
  b4Limit: 269280, b4Rate: 31,
  b5Limit: 560280, b5Rate: 35,
  b6Limit: 721560, b6Rate: 47,
  b7Rate: 50,
  creditPointValue: 2904,
  creditPerAdult: 2.25,
  creditPerChild: 1,
  creditBenefitBonus: 2,
  niHealthRate: 9,
  vatRate: 18,
  vatBase: 50,
  vatIncrement: 5,
  vatCap: 80
};

let BUDGET = { ...BUDGET_DEFAULTS };
let TAXCFG = { ...TAX_DEFAULTS };
let budgetSource = 'default';
let taxSource = 'default';

function parseCsv(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"' && text[i+1] === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n' || c === '\r'){
        if(field !== '' || row.length){ row.push(field); rows.push(row); }
        row = []; field = '';
        if(c === '\r' && text[i+1] === '\n') i++;
      } else field += c;
    }
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows;
}

async function loadSheet(url, labels, defaults){
  if(!url) return { config: { ...defaults }, source: 'default' };
  try{
    const res = await fetch(url, { cache: 'no-store' });
    if(!res.ok) throw new Error('fetch failed');
    const csvText = await res.text();
    const rows = parseCsv(csvText);
    const byLabel = {};
    rows.forEach(r => {
      const label = (r[0] || '').trim();
      const value = parseFloat((r[1] || '').replace(/[,\s]/g, ''));
      if(label && !isNaN(value)) byLabel[label] = value;
    });
    const next = {};
    let foundAny = false;
    for(const key in labels){
      const v = byLabel[labels[key]];
      if(typeof v === 'number'){ next[key] = v; foundAny = true; }
      else next[key] = defaults[key];
    }
    return { config: next, source: foundAny ? 'sheet' : 'default' };
  } catch(err){
    return { config: { ...defaults }, source: 'default' };
  }
}

async function loadConfig(){
  const [budgetResult, taxResult] = await Promise.all([
    loadSheet(BUDGET_CSV_URL, BUDGET_LABELS, BUDGET_DEFAULTS),
    loadSheet(TAX_CSV_URL, TAX_LABELS, TAX_DEFAULTS)
  ]);
  BUDGET = budgetResult.config; budgetSource = budgetResult.source;
  TAXCFG = taxResult.config; taxSource = taxResult.source;
}

let selectedEdu = '';
let selectedBenefit = '';

function buildBrackets(cfg){
  return [
    [cfg.b1Limit, cfg.b1Rate/100], [cfg.b2Limit, cfg.b2Rate/100],
    [cfg.b3Limit, cfg.b3Rate/100], [cfg.b4Limit, cfg.b4Rate/100],
    [cfg.b5Limit, cfg.b5Rate/100], [cfg.b6Limit, cfg.b6Rate/100],
    [Infinity, cfg.b7Rate/100]
  ];
}

function incomeTax(annual, cfg){
  let tax = 0, prev = 0;
  for(const [cap, rate] of buildBrackets(cfg)){
    if(annual > prev){
      const taxable = Math.min(annual, cap) - prev;
      tax += taxable * rate;
      prev = cap;
    } else break;
  }
  return tax;
}

function fmt(n){ return '\u20AA' + Math.round(n).toLocaleString('en-US'); }
function consumptionShare(hhsize, cfg){
  return Math.min(cfg.vatCap/100, cfg.vatBase/100 + (hhsize - 1) * (cfg.vatIncrement/100));
}

function compute(){
  const salary = parseFloat(document.getElementById('salary').value) || 0;
  const hhsize = Math.max(1, parseInt(document.getElementById('hhsize').value) || 1);
  const kids = Math.max(0, parseInt(document.getElementById('kids').value) || 0);

  const annualGross = salary * 12;
  const numAdults = Math.max(1, hhsize - kids);
  let creditPoints = TAXCFG.creditPerAdult * numAdults + TAXCFG.creditPerChild * kids;
  if(selectedBenefit && selectedBenefit !== 'none') creditPoints += TAXCFG.creditBenefitBonus;
  const creditValue = creditPoints * TAXCFG.creditPointValue;

  const incomeTaxDue = Math.max(0, incomeTax(annualGross, TAXCFG) - creditValue);
  const niHealth = annualGross * (TAXCFG.niHealthRate/100);
  const consumptionPct = consumptionShare(hhsize, TAXCFG);
  const vat = annualGross * consumptionPct * (TAXCFG.vatRate/(100+TAXCFG.vatRate));
  const totalTax = incomeTaxDue + niHealth + vat;

  const eduKeyByEdu = { mamlachti:'eduMamlachti', mamlachtiDati:'eduMamlachtiDati', haredi:'eduHaredi', arab:'eduArab' };
  const eduSum = BUDGET.eduMamlachti + BUDGET.eduHaredi + BUDGET.eduMamlachtiDati + BUDGET.eduArab;
  const yourEduBudget = BUDGET[eduKeyByEdu[selectedEdu || 'mamlachti']];
  const otherEduBudget = eduSum - yourEduBudget;

  const haredBudget = BUDGET.haredDirect + BUDGET.haredIndirect;
  const wbBudget = BUDGET.wbDirect + BUDGET.wbInfra + BUDGET.wbOther;

  return {
    hhsize, kids,
    haredSubAmt: totalTax * haredBudget / BUDGET.totalBudget,
    wbAmt: totalTax * wbBudget / BUDGET.totalBudget,
    yourEduAmt: totalTax * yourEduBudget / BUDGET.totalBudget,
    otherEduAmt: totalTax * otherEduBudget / BUDGET.totalBudget
  };
}

function render(){
  const r = compute();
  document.getElementById('subline').textContent = `משק בית של ${r.hhsize} \u00B7 ${r.kids} ילדים תלויים`;

  const icons = {
    coin: '<circle cx="12" cy="12" r="8"/><path d="M12 8.5 V15.5 M9.7 10 C9.7 9 10.6 8.4 12 8.4 C13.4 8.4 14.3 9.1 14.3 10 C14.3 12 9.7 11 9.7 13 C9.7 14 10.6 14.7 12 14.7 C13.4 14.7 14.3 14.1 14.3 13.1"/>',
    road: '<path d="M8 4 L4 20 M16 4 L20 20 M11.5 6 V9 M11 12 V15 M10.5 18 V20"/>',
    book: '<path d="M4 5 C7 4 9.5 4 12 5.5 C14.5 4 17 4 20 5 V18 C17 17 14.5 17 12 18.5 C9.5 17 7 17 4 18 Z M12 5.5 V18.5"/>',
    books: '<path d="M4 5 C7 4 9.5 4 12 5.5 C14.5 4 17 4 20 5 V18 C17 17 14.5 17 12 18.5 C9.5 17 7 17 4 18 Z M12 5.5 V18.5"/><path d="M2 7 L2 19"/><path d="M22 7 L22 19"/>'
  };
  function iconSvg(name, color){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${icons[name]}</svg>`;
  }

  const figures = [
    { label:'סבסוד לחרדים', amount:r.haredSubAmt, color:'var(--c-haredSub)', tint:'rgba(196,67,46,0.10)', icon:'coin' },
    { label:'התנחלויות יהודה ושומרון', amount:r.wbAmt, color:'var(--c-wb)', tint:'rgba(154,70,112,0.10)', icon:'road' },
    { label:'מערכת החינוך שלי', amount:r.yourEduAmt, color:'var(--c-edu)', tint:'rgba(196,148,31,0.12)', icon:'book' },
    { label:'מערכות החינוך האחרות', amount:r.otherEduAmt, color:'var(--c-otherEdu)', tint:'rgba(46,125,140,0.10)', icon:'books' }
  ];

  let html = '';
  figures.forEach(f => {
    html += `
    <div class="figure-card" style="--accent:${f.color}; --accent-tint:${f.tint}">
      <div class="figure-icon">${iconSvg(f.icon, f.color)}</div>
      <div class="figure-content">
        <div class="label">${f.label}</div>
        <div class="amt">${fmt(f.amount)}</div>
      </div>
    </div>`;
  });
  document.getElementById('figureGrid').innerHTML = html;

  const sourceLine = document.getElementById('sourceLine');
  if(sourceLine){
    if(budgetSource === 'sheet' && taxSource === 'sheet') sourceLine.textContent = 'מקור: גיליונות המפעיל (תקציב ומיסוי)';
    else if(budgetSource === 'default' && taxSource === 'default') sourceLine.textContent = 'מקור: נתוני ברירת מחדל';
    else sourceLine.textContent = 'מקור: חלקי — חלק מהגיליונות טרם חובר';
  }
}

document.getElementById('eduSelect').addEventListener('change', (e) => { selectedEdu = e.target.value; render(); });
document.getElementById('benefit').addEventListener('change', (e) => { selectedBenefit = e.target.value; render(); });
['salary','hhsize','kids'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
});

document.querySelectorAll('.stepper').forEach(stepper => {
  const targetId = stepper.dataset.target;
  const input = document.getElementById(targetId);
  const min = parseInt(input.min), max = parseInt(input.max);
  stepper.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const dir = parseInt(btn.dataset.dir);
      const next = Math.min(max, Math.max(min, parseInt(input.value) + dir));
      input.value = next;
      render();
    });
  });
});

function showView(name){
  document.getElementById('view-details').classList.toggle('active', name==='details');
  document.getElementById('view-results').classList.toggle('active', name==='results');
  document.getElementById('tabDetails').classList.toggle('active', name==='details');
  document.getElementById('tabResults').classList.toggle('active', name==='results');
  document.querySelector('.screen').scrollTop = 0;
}
document.getElementById('tabDetails').addEventListener('click', () => showView('details'));
document.getElementById('tabResults').addEventListener('click', () => showView('results'));
document.getElementById('goResults').addEventListener('click', () => showView('results'));

(async function init(){
  render(); // paint immediately with defaults, no blank screen while the sheet loads
  await loadConfig();
  render(); // re-paint with live sheet data if it arrived
})();
</script>
</body>
